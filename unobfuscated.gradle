plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
}

version = "${project.mod_version}+${sc.current.version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def accesswidener = "26.1.accesswidener"

loom {
    accessWidenerPath = rootProject.file("src/main/resources/accesswideners/${accesswidener}")
}

repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${sc.current.version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

stonecutter {
    replacements.string(true) {
        replace "KeyBinding", "KeyMapping"
        replace "keybinding.v1", "keymapping.v1"
        replace "GuiGraphics", "GuiGraphicsExtractor"
        replace "ClickType", "ContainerInput"
        replace "World", "Level"
        replace "WORLD", "LEVEL"
        replace "renderSlot", "extractSlot"
        replace "renderTooltip", "extractTooltip"
        replace "renderItemDecorations", "itemDecorations"
    }
    replacements.string(current.parsed.matches('>=26.2')) {
        replace "minecraft.screen", "minecraft.gui.screen()"
        replace "getToastManager", "gui.toastManager"
        replace "gui.Gui", "gui.Hud"
        replace "Gui.class", "Hud.class"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "aw", accesswidener
    inputs.property "minecraft", project.supported_versions

    filesMatching("fabric.mod.json") {
        expand inputs.properties
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}
