plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT'
}

version = "${project.mod_version}+${sc.current.version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def accesswidener = "1.21.11.accesswidener"

loom {
    accessWidenerPath = rootProject.file("src/main/resources/accesswideners/${accesswidener}")
}

repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${sc.current.version}"
    mappings loom.officialMojangMappings() 

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "aw", accesswidener
    inputs.property "minecraft", project.supported_versions

    filesMatching("fabric.mod.json") {
        expand inputs.properties
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}
